# Render blueprint — provisions Postgres, Redis, the API, and the web app.
# Deploys are triggered from GitHub Actions on merge to main (autoDeploy: false),
# via per-service Deploy Hooks. See README "Deployment".

databases:
  - name: mana-postgres
    plan: free
    databaseName: mana
    user: mana

services:
  - type: redis
    name: mana-redis
    plan: free
    ipAllowList: [] # internal only

  - type: web
    name: mana-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mana-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mana-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VERIFY_PROVIDER_MODE
        value: mock
      - key: SMS_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: mock
      # Set to the web service URL after first deploy (e.g. https://mana-web.onrender.com)
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: mana-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Set to the API service URL before the first web build (e.g. https://mana-api.onrender.com)
      - key: NEXT_PUBLIC_API_URL
        sync: false
